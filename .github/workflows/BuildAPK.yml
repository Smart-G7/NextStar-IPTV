name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Gradle'ı otomatik olarak kurar ve sisteme tanımlar
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # gradlew dosyasına ihtiyaç duymadan doğrudan global gradle komutunu çalıştırır
      - name: Build APK with Gradle
        run: gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NextStarIPTV-apk
          path: app/build/outputs/apk/release/*.apk

      # APK'yı doğrudan indirilebilir dosya olarak Releases sayfasına koyar
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NextStar IPTV build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
